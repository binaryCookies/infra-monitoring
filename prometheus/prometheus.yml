global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: infra
    env: production

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  # ── Live jobs ────────────────────────────────────────────────────────────────

  - job_name: node-exporter
    static_configs:
      - targets:
          - host.docker.internal:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080 # prod: 8080, local: 8181, dev: 8183

  # ── Live jobs (Session B) ─────────────────────────────────────────────────────

  # chatbot-api runs as a bare host process in dev (port 8181), not a container
  # on backend-chatbot-network — reach it via host.docker.internal.
  - job_name: chatbot-api
    static_configs:
      - targets:
          - host.docker.internal:8181
    metrics_path: /api/v1/metrics

  # ── Pending Session B ────────────────────────────────────────────────────────

  - job_name: nginx-exporter # pending Session B
    static_configs:
      - targets:
          - nginx-exporter:9113

  # UPDATE - add apache exporter (dev), nginx (prod)

  # ── Pending Session C ────────────────────────────────────────────────────────

  - job_name: pushgateway # pending Session C
    honor_labels: true
    static_configs:
      - targets:
          - pushgateway:9091
